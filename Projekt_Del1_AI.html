<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swopify - Bytesappen</title>
    <style>
        /* --- CSS: GRUNDDESIGN --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #97c2ee;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* --- INTRO-SEKTION MED FLEXBOX --- */
        .intro-sektion {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            margin-top: 20px;
        }
        .intro-text {
            flex: 1;
        }
        .logo-text {
            color: #1e1b4b;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0;
        }
        .logo-text span {
            color: #10b981; /* Gör "ify" grönt */
        }
        .tagline {
            margin-top: 5px;
            margin-bottom: 0;
            color: #575252;
            font-size: 15px;
        }
        .intro-bild-box {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }
        .intro-bild {
            max-width: 100%;
            height: auto;
            max-height: 140px;
            border-radius: 8px;
        }

        /* --- FORMULÄR --- */
        .form-box {
           /* 255, 255, 255 är vit. 0.6 betyder 80% synlig (20% transparent) */
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(5px); /*Gör bakgrunden bakom boxen suddig och lyxig */
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        margin-bottom: 30px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #27ae60;
        }

        /* --- PRODUKTKORT & BILDER --- */
        .produkt-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .produkt-kort {
        /* 90% synlig vit bakgrund */
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(5px); /* Samma suddiga glaseffekt här */
        border-radius: 8px;
        width: calc(33.333% - 14px);
        box-shadow: 0 4px 6px rgba(0,0,0,0.06);
        box-sizing: border-box;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        }
        
        .produkt-kort img {
            width: 50%;
            height: 120px;
            object-fit: cover;
        }

        .kort-innehall {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .kategori {
            background: #e1bee7;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            display: inline-block;
            align-self: flex-start;
            margin-bottom: 8px;
        }
        
        .produkt-kort h3 {
            margin: 5px 0;
            font-size: 18px;
        }

        /* RESPONSIV DESIGN (Mobilskärmar) */
        @media (max-width: 600px) {
            .intro-sektion {
                flex-direction: column;
                align-items: flex-start;
            }
            .intro-bild-box {
                justify-content: center;
                width: 100%;
            }
            .produkt-kort {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- INTRO-SEKTION -->
    <div class="intro-sektion">
        <div class="intro-text">
            <h1 class="logo-text">Swop<span>ify</span> 🔄</h1>
            <p class="tagline">Lägg upp något du vill bli av med och byt mot något roligare!</p>
        </div>
        <div class="intro-bild-box">
            <img src="bilder/Books_exchange.jpg" alt="Illustration" class="intro-bild">
        </div>
    </div>

    <!-- FORMULÄR FÖR ATT LÄGGA TILL PRODUKT -->
    <div class="form-box">
        <h3>Lägg upp en ny produkt</h3>
        <input type="text" id="prod-namn" placeholder="Vad vill du byta bort? (t.ex. PlayStation 4)">
        <select id="prod-kat">
            <option value="Elektronik">Elektronik</option>
            <option value="Kläder">Kläder</option>
            <option value="Böcker/Spel">Böcker/Spel</option>
            <option value="Övrigt">Övrigt</option>
        </select>
        <input type="text" id="prod-bild" placeholder="Klistra in en bildlänk (URL) eller lämna tom...">
        <input type="text" id="prod-onskan" placeholder="Vad vill du ha i utbyte? (t.ex. En cykel)">
        <button onclick="laggTillProdukt()">Publicera pryl</button>
    </div>

    <h2>Tillgängliga prylar för byte</h2>
    <!-- HÄR INUTI HAMNAR ALLA PRODUKTKORT VIA JAVASCRIPT -->
    <div class="produkt-grid" id="marknad"></div>
</div>

<footer style="text-align: center; margin-top: 5px; padding: 20px 0; color: #666; font-size: 14px;">
        <p>&copy; 2026 Swopify 🔄. All rights reserved.</p>
</footer>
<!-- JAVASCRIPT: LOGIK OCH FUNKTIONER -->
<script>
    // En lista med tre färdiga start-produkter (objekt)
    let produkter = [
        { 
            namn: "Gamla gummistövlar", 
            kategori: "Kläder", 
            onskan: "Ett paraply",
            bild: "bilder/gummistövlar.jpg"
        },
        { 
            namn: "Kemi 1 Lärobok", 
            kategori: "Böcker/Spel", 
            onskan: "Fysik 1 lärobok",
            bild: "bilder/Kemi1.jpg"
        },
        { 
            namn: "Hörlurar", 
            kategori: "Elektronik", 
            onskan: "Minihögtalare",
            bild: "bilder/hörlurar.jpg"
        }
        
    ];

    // Funktion för att rita ut alla produkter på skärmen 
    function visaProdukter() {
        let marknadDiv = document.getElementById("marknad");
        marknadDiv.innerHTML = ""; // Tömmer marknaden innan vi ritar om den 

        // Loopa igenom vår lista med produkter 
        for (let i = 0; i < produkter.length; i++) {
            let p = produkter[i]; // Plockar ut aktuellt objekt 
            
            // Bygger upp HTML-kortet med data från objektet och lägger till det på sidan 
            marknadDiv.innerHTML += `
                <div class="produkt-kort">
                    <img src="${p.bild}" alt="${p.namn}">
                    <div class="kort-innehall">
                        <div>
                            <span class="kategori">${p.kategori}</span>
                            <h3>${p.namn}</h3>
                            <p><b>Vill byta mot:</b><br>${p.onskan}</p>
                        </div>
                        <button style="background-color:#3498db" onclick="bytProdukt(${i})">Erbjud byte!</button>
                    </div>
                </div>
            `;
        }
    }

    // Funktion som körs när användaren klickar på "Publicera pryl" 
    function laggTillProdukt() {
        let namnInput = document.getElementById("prod-namn").value;
        let katInput = document.getElementById("prod-kat").value;
        let bildInput = document.getElementById("prod-bild").value;
        let onskanInput = document.getElementById("prod-onskan").value;

        // Kontrollera att användaren inte lämnat viktiga fält tomma 
        if (namnInput == "" || onskanInput == "") {
            alert("Fyll i vad du har och vad du vill ha först!");
            return;
        }

        // Om användaren inte skickar med en bildlänk, ge en slumpmässig bild automatiskt 
        if (bildInput == "") {
            bildInput = "https://picsum.photos/200" + Math.random();
        }

        // Skapa ett nytt objekt med all information //
        let nyProdukt = {
            namn: namnInput,
            kategori: katInput,
            onskan: onskanInput,
            bild: bildInput
        };

        // Skjut in det nya objektet i vår lista 
        produkter.push(nyProdukt);

        // Uppdatera skärmen direkt så att det nya kortet syns 
        visaProdukter();

        // Töm textfälten i formuläret //
        document.getElementById("prod-namn").value = "";
        document.getElementById("prod-bild").value = "";
        document.getElementById("prod-onskan").value = "";
    }

    // Funktion när man klickar på "Erbjud byte!" 
    // Tecknet ` är en grav accent (backtick på engelska) och används i JavaScript för att ge en mer kraftfull och flexibel syntax för att arbeta med strängar.
    function bytProdukt(index) {
        alert(`Ett meddelande har skickats om att du vill byta till dig: ${produkter[index].namn}!`);
    }

    // Kör igång funktionen en gång direkt när sidan startar så startprylarna syns 
    visaProdukter();
</script>

</body>
</html>
